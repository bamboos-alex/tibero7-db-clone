# 이관 타겟 Tibero 인스턴스
#
# 기존 tibero7 컨테이너의 AIMS_DEV 는 개발용이라 보존해야 하므로 별도 인스턴스를 쓴다.
# 배치 위치: ~/alex/tibero7_ut/docker-compose.yml
#
# 재생성 절차 (./data 를 비워야 DB 가 새로 만들어진다):
#   cd ~/alex/tibero7_ut
#   docker compose down
#   rm -rf ./data/*          # 되돌릴 수 없음
#   docker compose up -d
#   docker compose logs -f   # "Tibero is Ready To Use!" 대기 (수 분)
#
# 생성 직후 반드시 확인 (UTF8 이 아니면 다시 만들어야 한다):
#   docker exec -it tibero7_ut bash -lc "echo \"SELECT parameter, value FROM nls_database_parameters
#     WHERE parameter LIKE 'NLS_LANG%';\" | tbsql -s sys/tibero123"

services:
  tibero:
    image: tiberoofficial/tibero:latest
    container_name: tibero7_ut
    hostname: localhost          # 라이선스의 identified_by_host 와 일치해야 부팅된다

    environment:
      TB_ROOT_PASSWORD: tibero123

      # --- 이 두 줄이 재생성의 핵심 ---
      TB_SID: TAIMS              # DB_NAME=TAIMS. 소스와 DB명을 맞춰 접속 문자열 차이를 최소화
      CHAR_SET: MSWIN949         # ** 소스 실측값 **
      #
      # 소스는 UTF8 이 아니라 MSWIN949 다. NLS_LANG_AT_BOOT=UTF8 은 DB 캐릭터셋이 아니라
      # 기동 시점 클라이언트 NLS 값이었다. 실제 근거:
      #   - tbexport 가 매번 "Export character set: MSWIN949" 를 출력
      #   - 소스 DUMP: '신월여의지하도로종점' = 10자/20바이트, bd,c5,bf,f9,... (CP949 2바이트)
      # UTF8 타겟으로 적재하면 CP949->UTF-8 변환으로 길이가 1.5배가 되어
      # VARCHAR(30 BYTE) 컬럼이 넘친다(4개 테이블에서 실제 발생).
      # 소스와 문자셋을 맞추면 변환이 없어 바이트 단위로 동일한 복제본이 된다.

      # --- 적재 규모에 맞춘 여유 (약 450만 행 / 1.2GB + 인덱스 생성) ---
      TEMP_SIZE: 1G
      TEMP_AUTOEXTEND: Y
      UNDO_SIZE: 1G
      UNDO_AUTOEXTEND: Y

    ports:
      - "18629:8629"             # 호스트 18629 -> 컨테이너 8629

    volumes:
      - ./license/license.xml:/opt/tibero7/license/license.xml
      - ./data:/opt/tibero7/database
      - ./work:/tmp/tbmig          # 덤프·로그 작업 경로. 컨테이너를 다시 만들어도 남는다
      # ./init 은 마운트하지 않는다 — appuser/test 데모 테이블이 생기지 않게

    shm_size: 2gb                # tip 의 TOTAL_SHM_SIZE=2G 와 맞춘다

    restart: unless-stopped
